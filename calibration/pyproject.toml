[project]
name = "ragusa-a"
version = "0.1.0"
description = "Project A: a census of what existing conjecturing tools discard"
authors = [
    { name = "Carlo Perassi", email = "carlo.perassi@gmail.com" }
]
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.1.1",
    "txgraffiti==0.4.1",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
