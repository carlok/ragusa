[project]
name = "ragusa-a"
version = "0.1.0"
description = "Project A: a census of what existing conjecturing tools discard"
authors = [
    { name = "Carlo Perassi", email = "carlo.perassi@gmail.com" }
]
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5",
    "pandas>=3.0",
    "pulp>=3.3",
    "txgraffiti==0.4.1",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
